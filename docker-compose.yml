version: '5.6.0'
services:
  postgres:
    image: postgres:18.6
    container_name: gestao_vagas_postgres
    environment:
      POSTGRES_DB: gestao_vagas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgrespassword123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
